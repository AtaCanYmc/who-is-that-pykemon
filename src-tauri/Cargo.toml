[package]
name = "who-is-that-pykemon"
version = "1.4.0"
description = "Who is That Pykemon desktop application"
authors = ["AtaCanYmc"]
license = "MIT"
repository = "https://github.com/AtaCanYmc/who-is-that-pykemon"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7" }
tauri-plugin-log = "2"
