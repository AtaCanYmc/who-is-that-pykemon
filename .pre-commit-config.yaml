# ==========================================
# Pre-Commit Configuration
# See https://pre-commit.com for more information
# ==========================================
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(\.github/workflows/|\.release-please-manifest\.json)
      - id: check-json
        exclude: ^(\.vscode/|release-please-config\.json|\.release-please-manifest\.json)
      - id: check-added-large-files
        args: ['--maxkb=25000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: verify-grounding
        name: Verify Codebase Grounding
        entry: python3 scripts/verify-grounding.py
        language: system
        types: [markdown]
        pass_filenames: true

      - id: verify-anti-slop
        name: Anti-AI-Slop Linter
        entry: python3 scripts/verify-anti-slop.py
        language: system
        types: [markdown]
        pass_filenames: true
