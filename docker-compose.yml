services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pykemon-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/tmp/who_is_that_pykemon
    volumes:
      - backend-assets:/app/assets
      - backend-temp:/tmp/who_is_that_pykemon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - pykemon-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: pykemon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pykemon-network

networks:
  pykemon-network:
    driver: bridge

volumes:
  backend-assets:
  backend-temp:
